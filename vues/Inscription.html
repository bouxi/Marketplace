<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
</head>
<body>

<h2>Formulaire d'inscription</h2>

<form action="register.php" method="post" enctype="multipart/form-data">
    <label>
        <input type="text" name="firstName" placeholder="Prénom" required>
    </label><br>
    <label>
        <input type="text" name="lastName" placeholder="Nom" required>
    </label><br>
    <label>
        <input type="date" name="birthdate" required>
    </label><br>
    <label>
        <input type="text" name="phone" placeholder="Téléphone" required>
    </label><br>
    <label>
        <input type="email" name="email" placeholder="Email" required>
    </label><br>

    <!-- Affichage de l'avatar par défaut -->
    <label>Avatar :</label><br>
    <img src="/public/site/Logo.svg" alt="Avatar" id="avatar-preview" width="100"><br>
    <input type="file" name="avatar" id="avatar-input"><br>

    <label>
        <input type="text" name="username" placeholder="Nom d'utilisateur" required>
    </label><br>
    <label>
        <input type="password" name="password" placeholder="Mot de passe" required>
    </label><br>
    <label>
        <input type="password" name="confirmPassword" placeholder="Confirmer le mot de passe" required>
    </label><br>

    <input type="submit" value="Inscription">
</form>

<!-- Script pour afficher l'aperçu de l'avatar sélectionné -->
<script>
    document.getElementById('avatar-input').addEventListener('change', function(event) {
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('avatar-preview').src = e.target.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    });
</script>

</body>
</html>
